<!doctype html>
<html>
  <head>
    <title>Project Test</title>
	
	<!-- jquery -->
  <script src="jquery.min.js"></script>
  <script src="jquery-ui.min.js"></script>
  
  <link href="main.css" rel="stylesheet">
  <link href="tables.css" rel="stylesheet">
  <link href="project.css" rel="stylesheet">
  <link href="gantt.css" rel="stylesheet">
  <link href="jquery-ui.min.css" rel="stylesheet">
  <link href="tiptitle.css" rel="stylesheet">
  <link href="assets/fontawesome/css/fontawesome.css" rel="stylesheet">
  <link href="assets/fontawesome/css/brands.css" rel="stylesheet">
  <link href="assets/fontawesome/css/solid.css" rel="stylesheet">

  </head>

  <body>
    <div id="main_background" class="localtable">
      <div class="baseAbsolute" style="pointer-events: none">
        <div style="position: absolute;width: 20px;height: 20px;background: white;top: 10px;/*! z-index: 20; */left: 10px;cursor: pointer;border: 1px solid black;pointer-events: visible;">
          <!--<div class="fa-solid fa-upload"></div>-->
          <input type="file" id="csvFileInput" accept=".csv" />
        </div>
      </div>
      <div id="timeline_row" class="table-row">
        <div class="localtable">
          <div id="timeline_box"></div>
        </div>
      </div>
      <div id="gantt_chart_cells" class="remainderRow">
        <div class="remainderCell">
          <div class="localtable">
            <div class="remainderRow">
              <div id="gantt_table_cell_wrapper" class="table-cell" style="width:300px;">
                <div id="gantt_cell_wrapper">
                  <div class="baseRelative">
                    <div class="baseAbsolute">
                      <div id="gantt_cells" class="no-select localtable">

                      </div>
                    </div>
                  </div>
                </div>
              </div>
            
              <div id="gantt_chart_cell_wrapper" class="remainderCell">
                <div id="gantt_chart_wrapper">
                  <div class="baseRelative">
                    <div class="baseAbsolute">
                      <div id="gantt_chart" class="no-select localtable">
                        <div class="table-row">
                          <div class="remainderCell">
                            <div id="gantt_chart_label_wrapper" class="local-table">
                              <div id="gantt_chart_header_labels" class="remainderRow"></div>
                            </div>
                          </div>
                        </div>
                        <div class="remainderRow">
                          <div class="remainderCell">
                            <div id="gantt_chart_body" class="local-table"></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  
  <script src="functions.js" type="text/javascript"></script>
  
  <script src="main.js" type="text/javascript"></script>
  <script src="gantt.js" type="text/javascript"></script>
  <script src="tiptitle.js" type="text/javascript"></script>
</html>
